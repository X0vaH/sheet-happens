services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_ROOT_HOST: '%'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 2s
      timeout: 5s
      retries: 30
  tests:
    image: sail-8.5/app
    build:
      context: ./vendor/laravel/sail/runtimes/8.5
      args:
        WWWGROUP: '1000'
    environment:
      WWWUSER: '1000'
      TEST_MYSQL_HOST: mysql
      TEST_MYSQL_USER: root
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    command: ['composer', 'test:concurrency']
